name: Build & Release Plants_Vs_Zombie

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer_type: exe
            icon_path: assets/icon/icon.ico

          - os: macos-latest
            installer_type: dmg
            icon_path: assets/icon/icon.icns

          - os: ubuntu-latest
            installer_type: deb
            icon_path: assets/icon/icon.png

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # Linux dependencies
      - name: Install Linux dependencies for jpackage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm \
            libx11-dev libxtst-dev libxrender-dev libxrandr-dev libxi-dev

      - name: Clean & Build Fat JAR
        run: ./gradlew clean desktop:dist

      - name: Detect JAR
        shell: bash
        run: |
          JAR_PATH=$(ls desktop/build/libs/*.jar | head -n 1)
          echo "JAR_NAME=$(basename $JAR_PATH)" >> $GITHUB_ENV
          echo "INPUT_DIR=$(dirname $JAR_PATH)" >> $GITHUB_ENV
          echo "APP_NAME=Plants_Vs_Zombie" >> $GITHUB_ENV
          echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Create Installer
        shell: bash
        run: |
          MAIN_CLASS="pvz.com.lwjgl3.Lwjgl3Launcher"

          ICON_PARAM=""
          if [ -f "${{ matrix.icon_path }}" ]; then
            ICON_PARAM="--icon ${{ matrix.icon_path }}"
          fi

          jpackage \
            --input "$INPUT_DIR" \
            --name "$APP_NAME" \
            --main-jar "$JAR_NAME" \
            --main-class "$MAIN_CLASS" \
            --type "${{ matrix.installer_type }}" \
            --app-version "$APP_VERSION" \
            --java-options "-Xms512m -Xmx2048m" \
            $ICON_PARAM \
            --dest output

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
