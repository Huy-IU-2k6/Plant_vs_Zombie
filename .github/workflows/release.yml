name: Build & Release Plants_Vs_Zombie

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            installer_type: exe
            icon_path: assets/icon/icon.ico

          - os: macos-latest
            platform: mac
            installer_type: dmg
            icon_path: assets/icon/icon.icns

          - os: ubuntu-latest
            platform: linux
            installer_type: deb
            icon_path: assets/icon/icon.png

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      # --- FIX IS HERE: CHANGED desktop:dist TO lwjgl3:dist ---
      - name: Clean & Build Fat JAR
        run: ./gradlew clean lwjgl3:dist

      # --- FIX IS HERE: CHANGED SEARCH PATH TO lwjgl3 ---
      - name: Detect JAR and Set Variables
        shell: bash
        run: |
          # Search in lwjgl3/build/libs instead of desktop
          JAR_PATH=$(find lwjgl3/build/libs -name "*.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "❌ ERROR: JAR file not found in lwjgl3/build/libs!"
            # Debugging: List files to see what happened
            ls -R lwjgl3/build/libs
            exit 1
          fi

          echo "✅ Found JAR: $JAR_PATH"
          echo "JAR_NAME=$(basename "$JAR_PATH")" >> $GITHUB_ENV
          echo "INPUT_DIR=$(dirname "$JAR_PATH")" >> $GITHUB_ENV
          echo "APP_NAME=Plants_Vs_Zombie" >> $GITHUB_ENV

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Installer
        shell: bash
        run: |
          # Ensure this matches your actual Launcher class package
          MAIN_CLASS="pvz.com.lwjgl3.Lwjgl3Launcher"

          ICON_PARAM=""
          if [ -f "${{ matrix.icon_path }}" ]; then
            ICON_PARAM="--icon ${{ matrix.icon_path }}"
          fi

          jpackage \
            --input "$INPUT_DIR" \
            --name "$APP_NAME" \
            --main-jar "$JAR_NAME" \
            --main-class "$MAIN_CLASS" \
            --type "${{ matrix.installer_type }}" \
            --app-version "$APP_VERSION" \
            --vendor "PvZ Team" \
            --java-options "-Xms512m -Xmx2048m" \
            $ICON_PARAM \
            --dest output

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
