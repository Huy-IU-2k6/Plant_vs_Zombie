name: Build & Release Plants_Vs_Zombie

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 🔥 THÊM ĐOẠN NAY ĐỂ CẤP QUYỀN GHI (SỬA LỖI 403)
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            installer_type: exe
            icon_path: assets/icon/icon.ico

          - os: macos-latest
            platform: mac
            installer_type: dmg
            icon_path: assets/icon/icon.icns

          - os: ubuntu-latest
            platform: linux
            installer_type: deb
            icon_path: assets/icon/icon.png

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Clean & Build Fat JAR
        run: ./gradlew clean lwjgl3:dist

      - name: Detect JAR and Set Variables
        shell: bash
        run: |
          JAR_PATH=$(find lwjgl3/build/libs -name "*.jar" | head -n 1)
          
          if [ -z "$JAR_PATH" ]; then
            echo "❌ ERROR: JAR file not found in lwjgl3/build/libs!"
            ls -R lwjgl3/build/libs
            exit 1
          fi

          echo "✅ Found JAR: $JAR_PATH"
          echo "JAR_NAME=$(basename "$JAR_PATH")" >> $GITHUB_ENV
          echo "INPUT_DIR=$(dirname "$JAR_PATH")" >> $GITHUB_ENV
          echo "APP_NAME=Plants_Vs_Zombie" >> $GITHUB_ENV
          
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # ✅ Windows: chạy riêng theo chuẩn PowerShell
      - name: Create Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAVA_HOME = "${env:JAVA_HOME}"
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"

          $APP      = "$env:APP_NAME"
          $VER      = "$env:APP_VERSION"
          $MAINCLASS= "pvz.com.lwjgl3.Lwjgl3Launcher"

          $LIBDIR   = "lwjgl3\build\libs"
          $DESTDIR  = "output"   # để khớp bước Upload Release: output/*

          New-Item -ItemType Directory -Force -Path $DESTDIR | Out-Null

          $MAINJAR = Get-ChildItem $LIBDIR -Filter "*.jar" |
            Where-Object { $_.Name -notmatch '(sources|javadoc)\.jar$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $MAINJAR) {
            Write-Host "❌ ERROR: No main jar found in $LIBDIR"
            Get-ChildItem $LIBDIR
            exit 1
          }

          $ICON_PARAM = @()
          if (Test-Path "${{ matrix.icon_path }}") { $ICON_PARAM = @("--icon", "${{ matrix.icon_path }}") }

          jpackage `
            --type exe `
            --dest $DESTDIR `
            --name $APP `
            --app-version $VER `
            --input $LIBDIR `
            --main-jar $MAINJAR `
            --main-class $MAINCLASS `
            @ICON_PARAM `
            --win-shortcut `
            --win-menu `
            --win-menu-group $APP `
            --vendor "PvZ Team" `
            --java-options "-Xms512m -Xmx2048m"

      # ✅ macOS/Linux: giữ bash như cũ
      - name: Create Installer (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          MAIN_CLASS="pvz.com.lwjgl3.Lwjgl3Launcher"

          ICON_PARAM=""
          if [ -f "${{ matrix.icon_path }}" ]; then
            ICON_PARAM="--icon ${{ matrix.icon_path }}"
          fi

          jpackage \
            --input "$INPUT_DIR" \
            --name "$APP_NAME" \
            --main-jar "$JAR_NAME" \
            --main-class "$MAIN_CLASS" \
            --type "${{ matrix.installer_type }}" \
            --app-version "$APP_VERSION" \
            --vendor "PvZ Team" \
            --java-options "-Xms512m -Xmx2048m" \
            $ICON_PARAM \
            --dest output

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
